name: AppImage Dry Run

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-appimage-changes:
    name: detect-appimage-changes
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.detect.outputs.required }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Linux-relevant changes
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "required=true" >> "${GITHUB_OUTPUT}"
          else
            ./.github/scripts/detect-relevant-changes.sh "${BASE_SHA}" "${HEAD_SHA}" linux
          fi

  appimage-dry-run:
    name: appimage-heavy
    needs: detect-appimage-changes
    if: needs.detect-appimage-changes.outputs.required == 'true'
    runs-on: ubuntu-24.04
    env:
      APPIMAGE_VERSION: dry-run-${{ github.run_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: master

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked TUI dependencies
        working-directory: tui
        run: bun install --frozen-lockfile

      - name: Run core tests
        working-directory: core
        run: zig build test

      - name: Run TUI tests
        working-directory: tui
        run: bun test --preload @opentui/solid/preload

      - name: Build Linux core
        run: ./packaging/appimage/scripts/build-core.sh

      - name: Package AppImage
        run: ./packaging/appimage/scripts/package-appimage.sh

      - name: Verify AppImage artifact
        run: ./packaging/appimage/scripts/verify-artifact.sh

      - name: Build artifact checksum
        shell: bash
        run: |
          set -euo pipefail
          artifact="packaging/out/appimage/tty-clock-timer-${APPIMAGE_VERSION}-linux-x86_64.AppImage"
          sha256sum "${artifact}" > "${artifact}.sha256"

      - name: Upload dry-run artifact
        uses: actions/upload-artifact@v7
        with:
          name: appimage-dry-run-${{ github.run_number }}
          path: |
            packaging/out/appimage/*.AppImage
            packaging/out/appimage/*.sha256
          if-no-files-found: error
          retention-days: 7

  appimage-required:
    name: appimage-required
    needs: [detect-appimage-changes, appimage-dry-run]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout gate script
        uses: actions/checkout@v7

      - name: Enforce Linux validation result
        env:
          DETECT_RESULT: ${{ needs.detect-appimage-changes.result }}
          REQUIRED: ${{ needs.detect-appimage-changes.outputs.required }}
          HEAVY_RESULT: ${{ needs.appimage-dry-run.result }}
        run: ./.github/scripts/validate-required-gate.sh "${DETECT_RESULT}" "${REQUIRED}" "${HEAVY_RESULT}" Linux
