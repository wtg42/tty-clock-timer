name: Tag Driven Cross-Platform Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: master

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked TUI dependencies
        working-directory: tui
        run: bun install --frozen-lockfile

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Invalid release tag::Tag '${GITHUB_REF_NAME}' must match v<major>.<minor>.<patch>."
            exit 1
          fi

      - name: Prepare appimagetool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packaging/tools
          curl -fsSL -o packaging/tools/appimagetool.AppImage "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod 0755 packaging/tools/appimagetool.AppImage

      - name: Build Linux core
        run: ./packaging/appimage/scripts/build-core.sh

      - name: Package Linux AppImage
        env:
          APPIMAGE_VERSION: ${{ github.ref_name }}
        run: ./packaging/appimage/scripts/package-appimage.sh

      - name: Verify Linux AppImage
        env:
          APPIMAGE_VERSION: ${{ github.ref_name }}
        run: ./packaging/appimage/scripts/verify-artifact.sh

      - name: Build Linux checksum and metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          out_dir="packaging/out/appimage"
          artifact="tty-clock-timer-${version}-linux-x86_64.AppImage"
          (cd "${out_dir}" && sha256sum "${artifact}" > "${artifact}.sha256")
          sha_value="$(cut -d ' ' -f1 "${out_dir}/${artifact}.sha256")"
          printf '{\n  "tag": "%s",\n  "version": "%s",\n  "platform": "linux-x86_64",\n  "artifact": "%s",\n  "artifact_sha256": "%s"\n}\n' \
            "${version}" "${version}" "${artifact}" "${sha_value}" \
            > "${out_dir}/release-metadata-${version}.json"

      - name: Upload verified Linux release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: |
            packaging/out/appimage/*.AppImage
            packaging/out/appimage/*.AppImage.sha256
            packaging/out/appimage/release-metadata-*.json
          if-no-files-found: error

  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: master

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked TUI dependencies
        working-directory: tui
        run: bun install --frozen-lockfile

      - name: Run macOS core tests
        working-directory: core
        run: zig build test

      - name: Run macOS TUI tests
        working-directory: tui
        run: bun test --preload @opentui/solid/preload

      - name: Package macOS arm64 archive
        env:
          MACOS_VERSION: ${{ github.ref_name }}
        run: ./packaging/macos/scripts/package-macos.sh

      - name: Verify macOS package and runtime
        env:
          MACOS_VERSION: ${{ github.ref_name }}
        run: ./packaging/macos/scripts/verify-artifact.sh

      - name: Upload verified macOS release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: |
            packaging/out/macos/*.tar.gz
            packaging/out/macos/*.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified platform assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Validate complete release asset set
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          test -f "release-assets/tty-clock-timer-${version}-linux-x86_64.AppImage"
          test -f "release-assets/tty-clock-timer-${version}-linux-x86_64.AppImage.sha256"
          test -f "release-assets/release-metadata-${version}.json"
          test -f "release-assets/tty-clock-timer-${version}-macos-arm64.tar.gz"
          test -f "release-assets/tty-clock-timer-${version}-macos-arm64.tar.gz.sha256"

      - name: Publish one cross-platform GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes_file="release-notes.md"
          cat > "${notes_file}" <<EOF
          Version: ${tag}

          Platforms:
          - Linux x86_64 AppImage
          - macOS Apple Silicon (arm64) tarball; requires Bun

          The macOS artifact is not codesigned or notarized. Verify the SHA-256 checksum before use.
          EOF

          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" --title "tty-clock-timer ${tag}" --notes-file "${notes_file}"
          fi
          gh release upload "${tag}" release-assets/* --clobber
