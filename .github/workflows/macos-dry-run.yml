name: macOS Dry Run

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-macos-changes:
    name: detect-macos-changes
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.detect.outputs.required }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect macOS-relevant changes
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "required=true" >> "${GITHUB_OUTPUT}"
          else
            ./.github/scripts/detect-relevant-changes.sh "${BASE_SHA}" "${HEAD_SHA}" macos
          fi

  macos-dry-run:
    name: macos-heavy
    needs: detect-macos-changes
    if: needs.detect-macos-changes.outputs.required == 'true'
    runs-on: macos-15
    env:
      MACOS_VERSION: dry-run-${{ github.run_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: master

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked TUI dependencies
        working-directory: tui
        run: bun install --frozen-lockfile

      - name: Run core tests
        working-directory: core
        run: zig build test

      - name: Run TUI tests
        working-directory: tui
        run: bun test --preload @opentui/solid/preload

      - name: Build and package macOS arm64 artifact
        run: ./packaging/macos/scripts/package-macos.sh

      - name: Verify package and runtime smoke test
        run: ./packaging/macos/scripts/verify-artifact.sh

      - name: Verify packaging failure diagnostics
        run: ./packaging/macos/scripts/test-failures.sh

      - name: Upload macOS dry-run artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-dry-run-${{ github.run_number }}
          path: |
            packaging/out/macos/*.tar.gz
            packaging/out/macos/*.tar.gz.sha256
          if-no-files-found: error

  macos-required:
    name: macos-required
    needs: [detect-macos-changes, macos-dry-run]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout gate script
        uses: actions/checkout@v7

      - name: Enforce macOS validation result
        env:
          DETECT_RESULT: ${{ needs.detect-macos-changes.result }}
          REQUIRED: ${{ needs.detect-macos-changes.outputs.required }}
          HEAVY_RESULT: ${{ needs.macos-dry-run.result }}
        run: ./.github/scripts/validate-required-gate.sh "${DETECT_RESULT}" "${REQUIRED}" "${HEAVY_RESULT}" macOS
